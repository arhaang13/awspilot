id: secretsmanager-secret
area: security
request: 'Create a Secrets Manager secret named checkout/db with the JSON value {"username": "app", "password":
  "change-me"} and the description ''Checkout database login''.'
baseline_minutes: 4
guidance:
- SecretString carries the JSON as a string.
- Roll back with delete_secret and ForceDeleteWithoutRecovery.
checks:
- description: secret exists with the description
  call:
    service: secretsmanager
    operation: describe_secret
    params:
      SecretId: checkout/db
  expect:
  - path: Description
    equals: Checkout database login
- description: secret value has the username
  call:
    service: secretsmanager
    operation: get_secret_value
    params:
      SecretId: checkout/db
  expect:
  - path: SecretString
    contains: app
reference:
  summary: 'Create a Secrets Manager secret named checkout/db with the JSON value {"username": "app",
    "password": "change-me"} and the description ''Checkout database login''.'
  steps:
  - id: create_secret
    description: Create the secret
    call:
      service: secretsmanager
      operation: create_secret
      params:
        Name: checkout/db
        Description: Checkout database login
        SecretString: '{"username": "app", "password": "change-me"}'
    rollback:
      service: secretsmanager
      operation: delete_secret
      params:
        SecretId: checkout/db
        ForceDeleteWithoutRecovery: true
